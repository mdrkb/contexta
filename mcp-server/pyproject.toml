[project]
name = "contexta-mcp"
version = "0.0.1"
description = "MCP server for contexta — ingests KNOWLEDGE.md files into Qdrant and serves semantic search over them."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3.0",
  "qdrant-client>=1.11.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
contexta-mcp = "contexta_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contexta_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]